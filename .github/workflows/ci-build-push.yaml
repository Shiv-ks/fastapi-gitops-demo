name: CI - Build and Push to ACR

on:
  push:
    branches:
      - main

permissions:
  id-token: write          # Required for OIDC login to Azure
  contents: write          # Needed to commit/push manifest changes

env:
  IMAGE_NAME: fastapi-gitops-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Enable multi-architecture build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Azure using OIDC (secure, no secrets)
      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to Azure Container Registry
      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # Build and push the Docker image for AMD64
      - name: Build and push Docker image (amd64 + latest)
        run: |
          IMAGE_TAG=${{ github.run_number }}
          IMAGE_NAME=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}

          echo "Building image: $IMAGE_NAME:$IMAGE_TAG"
          docker buildx build --platform linux/amd64 \
            -t $IMAGE_NAME:$IMAGE_TAG \
            -t $IMAGE_NAME:latest \
            --push .

      # Update Kubernetes manifest with the new image tag
      - name: Update Kubernetes manifest with new image tag
        run: |
          IMAGE_TAG=${{ github.run_number }}
          echo "Updating manifests/deployment.yaml with image tag: $IMAGE_TAG"
          sed -i "s|image: .*|image: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" manifests/deployment.yaml

      # Commit and push manifest changes to the repo (so Argo CD redeploys)
      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add manifests/deployment.yaml
          git commit -m "Update image tag to run #${{ github.run_number }}" || echo "No changes to commit"
          git push
