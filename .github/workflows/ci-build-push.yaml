name: CI - Build and Push to ACR

on:
push:
branches:
- main

permissions:
id-token: write          # Required for OIDC login to Azure
contents: write          # Needed to commit/push manifest changes

env:
IMAGE_NAME: fastapi-gitops-demo

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
with:
token: ${{ secrets.GITHUB_TOKEN }}


  - name: Log in to Azure using OIDC
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZURE_CLIENT_ID }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  - name: Log in to Azure Container Registry
    run: az acr login --name ${{ secrets.ACR_NAME }}

  - name: Build and push Docker image (amd64 + latest)
    run: |
      IMAGE_TAG=${{ github.run_number }}
      IMAGE_NAME=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}

      # Build image for amd64 and push both tags
      docker buildx build --platform linux/amd64 \
        -t $IMAGE_NAME:$IMAGE_TAG \
        -t $IMAGE_NAME:latest \
        --push .

  - name: Update Kubernetes manifest with new image tag
    run: |
      IMAGE_TAG=${{ github.run_number }}
      sed -i "s|image: .*|image: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" manifests/deployment.yaml

  - name: Commit and push manifest update
    run: |
      git config user.name "github-actions"
      git config user.email "${{ github.actor }}@users.noreply.github.com"
      git add manifests/deployment.yaml
      git commit -m "Update image tag to run #${{ github.run_number }}" || echo "No changes to commit"
      git push

