name: CI - Build and Push to ACR

on:
  push:
    branches:
      - main

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  IMAGE_NAME: fastapi-gitops-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker image locally
        run: |
          IMAGE_TAG=${{ github.run_number }}
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:$IMAGE_TAG .

      - name: Push Docker image to ACR
        run: |
          IMAGE_TAG=${{ github.run_number }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:$IMAGE_TAG

      - name: Update Kubernetes manifest with new image tag
        run: |
          sed -i "s|image: .*|image: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}|g" manifests/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add manifests/deployment.yaml
          git commit -m "Update image tag to run #${{ github.run_number }}" || echo "No changes to commit"
          git push
